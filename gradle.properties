# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# 🚀 BUILD PERFORMANCE OPTIMIZATIONS 🚀

# Increase JVM memory for faster compilation
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -XX:+UseStringDeduplication

# Enable Gradle parallel execution
org.gradle.parallel=true

# 📱 ANDROID SDK CONFIGURATION 📱

# Accept all SDK licenses automatically
android.acceptAllLicenses=true

# Disable SDK license checks for testing
android.builder.sdkDownload=true

# Enable Gradle build cache
org.gradle.caching=true

# Enable configuration cache (disabled due to release build issues)
# org.gradle.configuration-cache=true

# Enable build cache for faster incremental builds (using Gradle build cache)

# Enable R8 full mode for faster builds
android.enableR8.fullMode=true

# Disable unnecessary features for faster builds
android.enableJetifier=false

# Kotlin compiler optimizations
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
kotlin.incremental.android=true
kotlin.incremental.java=true

# Test optimizations
android.testoptions.manageddevices.maxconcurrent=4
android.testoptions.manageddevices.parallel=true

# Disable unused features
android.enableVcs=false
android.enableBuildConfigAsBytecode=true

# Signing configuration (passwords are in local.properties, which is gitignored)
RELEASE_STORE_FILE=release.keystore
RELEASE_KEY_ALIAS=notablymd

# App version
app.lastVersionName=1.0.0
app.versionCode=1
app.versionName=1.0.0
android.experimental.enableNewResourceShrinker.preciseShrinking=true
android.suppressUnsupportedCompileSdk=36
